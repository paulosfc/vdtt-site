<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Vendetta</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header">

        <div class="logo">

            <span>CRAFT</span>
            <small>CALCULADORA</small>

        </div>

    </header>

    <!-- LOGIN -->
    <main class="login-container">

        <div class="login-card">

            <div class="login-header">
                <h1>Bem - Vindo</h1>

                <p>
                    Entre na sua conta para acessar
                    a calculadora de craft.
                </p>
            </div>

            <form id="loginForm">

                <!-- USUARIO -->
                <div class="input-group">

                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username">
                </div>

                <!-- SENHA -->
                <div class="input-group">

                    <label for="password">Senha</label>

                    <div class="password-container">

                        <input type="password" id="password" placeholder="Digite sua senha"
                            autocomplete="current-password">

                        <button type="button" id="togglePassword" class="toggle-password">👁</button>
                    </div>

                </div>

                <!-- LEMBRAR -->
                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox" id="remember">
                        <span>Lembrar de mim</span>

                    </label>

                    <a href="#" id="forgotPassword">
                        Esqueci minha senha
                    </a>

                </div>

                <!-- MENSAGEM -->
                <div class="message" id="message"></div>

                <!-- BOTÃO -->
                <button type="submit" class="login-button">ENTRAR</button>

            </form>

            <!-- CADASTRO -->
            <div class="register">
                <span>
                    Ainda não possuir uma conta?
                </span>

                <a href="#">Cadastrar - se</a>

            </div>

        </div>

    </main>



    <!-- FOOTER -->
    <footer>

        <span>VENDETTA © 2026</span>

    </footer>









    <script src="assets/js/script.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/encomendas.js"></script>
</body>

</html>
